<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 175" width="660" height="175">
  <defs>
    <!-- Gradient for the golden ornament: lighter gold at top, deeper orange at bottom -->
    <linearGradient id="goldGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fcd535"/>
      <stop offset="35%" stop-color="#f0a020"/>
      <stop offset="100%" stop-color="#e8922a"/>
    </linearGradient>
  </defs>

  <!-- ===== H letter: dark navy, bold italic, sans-serif ===== -->
  <text x="5" y="152"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-size="155" font-weight="900" font-style="italic"
        fill="#1b2a4a">H</text>

  <!-- ===== Golden ornament (treble-clef / decorative ampersand) ===== -->
  <!-- Compound path: outer shape + inner hole using evenodd fill -->
  <path d="
    M 166,2
    C 170,2 178,15 180,36
    C 181,50 180,62 178,74
    C 177,80 178,86 180,92
    C 186,100 194,110 196,122
    C 198,136 190,150 176,156
    C 166,160 154,158 144,150
    C 132,142 124,130 124,118
    C 124,108 128,98 136,92
    C 144,86 156,82 162,76
    C 160,66 156,48 154,36
    C 152,22 156,8 160,2
    C 162,0 164,0 166,2
    Z
    M 160,107
    C 150,107 143,115 143,124
    C 143,133 150,141 160,141
    C 170,141 177,133 177,124
    C 177,115 170,107 160,107
    Z
  " fill="url(#goldGrad)" fill-rule="evenodd"/>

  <!-- ===== S letter: dark navy, bold italic, sans-serif ===== -->
  <text x="200" y="152"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-size="155" font-weight="900" font-style="italic"
        fill="#1b2a4a">S</text>

  <!-- ===== ® registered trademark symbol ===== -->
  <g transform="translate(312, 32)">
    <circle cx="0" cy="0" r="7" fill="none" stroke="#1b2a4a" stroke-width="1.2"/>
    <text x="0" y="3.5" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="10" font-weight="bold"
          fill="#1b2a4a">R</text>
  </g>

  <!-- ===== Orange horizontal separator line ===== -->
  <line x1="345" y1="72" x2="650" y2="72"
        stroke="#e8922a" stroke-width="2" stroke-linecap="round"/>

  <!-- ===== HOME text ===== -->
  <text x="348" y="60"
        font-family="'Century Gothic', 'Futura', 'Montserrat', 'Trebuchet MS', sans-serif"
        font-size="44" font-weight="400" letter-spacing="12"
        fill="#1b2a4a">HOME</text>

  <!-- ===== SOLUTION text ===== -->
  <!-- "SOLUTI" in dark navy -->
  <text x="348" y="130"
        font-family="'Century Gothic', 'Futura', 'Montserrat', 'Trebuchet MS', sans-serif"
        font-size="44" font-weight="400" letter-spacing="4"
        fill="#1b2a4a">SOLUTI</text>

  <!-- Power-button O (orange) -->
  <g transform="translate(516, 100)">
    <circle cx="15" cy="16" r="14" fill="none" stroke="#e8922a" stroke-width="3"/>
    <line x1="15" y1="2" x2="15" y2="13" stroke="#e8922a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- "N" in orange -->
  <text x="550" y="130"
        font-family="'Century Gothic', 'Futura', 'Montserrat', 'Trebuchet MS', sans-serif"
        font-size="44" font-weight="400"
        fill="#e8922a">N</text>
</svg>
