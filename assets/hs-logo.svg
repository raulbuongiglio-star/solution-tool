<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180" width="700" height="180">
  <!-- Transparent background -->

  <!-- ===== Large bold italic H ===== -->
  <text x="5" y="150"
        font-family="'Arial Black', 'Impact', 'Helvetica Neue', sans-serif"
        font-size="170" font-weight="900" font-style="italic"
        fill="#ffffff">H</text>

  <!-- ===== Ornamental & (script calligraphic style, orange) ===== -->
  <text x="135" y="148"
        font-family="'Palatino Linotype', 'Book Antiqua', 'Palatino', 'Georgia', serif"
        font-size="140" font-weight="bold" font-style="italic"
        fill="#e8922a">&amp;</text>

  <!-- ===== Large bold italic S ===== -->
  <text x="250" y="150"
        font-family="'Arial Black', 'Impact', 'Helvetica Neue', sans-serif"
        font-size="170" font-weight="900" font-style="italic"
        fill="#ffffff">S</text>

  <!-- ===== ® symbol ===== -->
  <circle cx="400" cy="25" r="8" fill="none" stroke="#ffffff" stroke-width="1.2" />
  <text x="400" y="30" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="12" font-weight="bold"
        fill="#ffffff">R</text>

  <!-- ===== HOME ===== -->
  <text x="430" y="65"
        font-family="'Century Gothic', 'Montserrat', 'Trebuchet MS', sans-serif"
        font-size="44" font-weight="300" letter-spacing="14"
        fill="#ffffff">HOME</text>

  <!-- ===== SOLUTION with power-button O ===== -->
  <text x="430" y="135"
        font-family="'Century Gothic', 'Montserrat', 'Trebuchet MS', sans-serif"
        font-size="44" font-weight="300" letter-spacing="6"
        fill="#ffffff">S</text>

  <!-- Power-button O -->
  <g transform="translate(468, 108)">
    <circle cx="14" cy="14" r="13" fill="none" stroke="#ffffff" stroke-width="2.8" />
    <line x1="14" y1="1" x2="14" y2="12" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" />
  </g>

  <text x="498" y="135"
        font-family="'Century Gothic', 'Montserrat', 'Trebuchet MS', sans-serif"
        font-size="44" font-weight="300" letter-spacing="6"
        fill="#ffffff">LUTION</text>
</svg>
